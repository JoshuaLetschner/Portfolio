# Prüft jeden Push und Pull Request: Installation, Typ-/Inhaltsprüfung, Build, Smoke-Tests.
# Bewusst ohne Deployment – das übernimmt Cloudflare Workers Builds direkt aus GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:smoke
